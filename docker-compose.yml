version: '3.8'

services:
  postgres:
    image: ankane/pgvector:latest
    container_name: procurement_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: procurement_intel
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      # DIKOREKSI: Menyesuaikan parameter admin dan procurement_intel
      test: ["CMD-SHELL", "pg_isready -U admin -d procurement_intel"]
      interval: 5s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: procurement_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  # DIKOREKSI: Nama disinkronkan dengan referensi di atas
  postgres_data:
  ollama:
    external: true